; PlatformIO project configuration for ESP32-S3 Solar Tracker
; Board: Espressif ESP32-S3 (generic)
; Framework: Arduino

[env:esp32-s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Serial monitor
monitor_speed = 115200

; Build flags
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

; Libraries (PlatformIO registry)
lib_deps =
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit INA219 @ ^1.2.1
    adafruit/Adafruit BusIO @ ^1.16.1
    ESP32Servo @ ^0.13.0
    bblanchon/ArduinoJson @ ^7.0.4
    ; Built-in: WiFi, WebServer, Wire — no external lib needed

; Upload speed
upload_speed = 921600

; Partition scheme (default is usually fine for this firmware size)
board_build.partitions = default.csv
